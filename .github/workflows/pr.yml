name: PR

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - "exampleSite/**"
      - "hugo.toml"
      - "layouts/**"
      - "scripts/**"

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
