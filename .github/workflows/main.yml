name: Main

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "Makefile"
      - "exampleSite/**"
      - "layouts/**"
      - "scripts/**"

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
  test:
    uses: ./.github/workflows/test.yml
