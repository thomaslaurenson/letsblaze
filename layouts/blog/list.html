{{ define "main" }}
<h1>{{ .Title }}</h1>
{{ .Content }}
{{ with .Site.Taxonomies.tags }}
<nav aria-label="Tags">
  <ul>
    {{ range .ByCount }}
      <li><a href="{{ .Page.RelPermalink }}">{{ .Page.Title }} ({{ .Count }})</a></li>
    {{ end }}
  </ul>
</nav>
{{ end }}
{{ partial "post-list.html" . }}
{{ end }}
