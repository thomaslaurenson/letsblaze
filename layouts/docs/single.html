{{ define "main" }}
{{ partial "breadcrumb.html" . }}
<article>
  <h1>{{ .Title }}</h1>
  {{ partial "toc.html" . }}
  {{ .Content }}
</article>
<hr>
<nav aria-label="Page navigation">
  {{ with .PrevInSection }}<a href="{{ .RelPermalink }}" aria-label="Previous page: {{ .Title }}">prev - {{ .Title }}</a>{{ end }}
  {{ if and .PrevInSection .NextInSection }} - {{ end }}
  {{ with .NextInSection }}<a href="{{ .RelPermalink }}" aria-label="Next page: {{ .Title }}">next - {{ .Title }}</a>{{ end }}
</nav>
{{ end }}
